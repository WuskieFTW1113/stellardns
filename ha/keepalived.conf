# StellarDNS HA — keepalived
#
# Deploy StellarDNS identically on TWO nodes, install keepalived on both
# (apt install keepalived / apk add keepalived), drop this at
# /etc/keepalived/keepalived.conf on each, then point DHCP's DNS at the VIP.
#
# NODE A: use as-is.
# NODE B: state BACKUP, priority 100, and swap unicast_src_ip / unicast_peer.
#
# The VIP is not a proxy. It is an address that MOVES to whichever node is currently
# healthy; that node answers clients directly. There is no extra hop.

# ---------------------------------------------------------------------------
# Health check
#
# This MUST test "is this resolver alive", not "can it reach the internet".
# health.stellardns is answered locally by StellarDNS and never forwarded, so a
# WAN outage cannot fail it. Checking a public name here would fail on EVERY node
# at once during an upstream outage, dropping the VIP at exactly the moment you
# still want local DNS serving cache and LANCache rewrites.
# ---------------------------------------------------------------------------
vrrp_script chk_stellardns {
    script "/usr/bin/dig @127.0.0.1 +short +time=1 +tries=1 health.stellardns"
    interval 2
    timeout 2       # never let a hung check wedge the instance
    fall 2          # 2 consecutive failures -> unhealthy (~4s)
    rise 2          # 2 consecutive successes -> healthy again
    weight 0        # 0 = failure puts this instance in FAULT and yields the VIP
    user nobody
}

vrrp_instance STELLARDNS {
    state MASTER                  # BACKUP on node B
    interface eth0                # the LAN interface
    virtual_router_id 53          # must match on both nodes, unique on the LAN
    priority 150                  # 100 on node B
    advert_int 1                  # failover ~ 3 x advert_int ~ 3s

    # Unicast VRRP: works when multicast (224.0.0.18) is filtered by the switch or
    # firewall, which is a common cause of both nodes believing they are MASTER.
    unicast_src_ip 192.168.9.10   # THIS node
    unicast_peer {
        192.168.9.11              # the OTHER node
    }

    authentication {
        auth_type PASS
        auth_pass ChangeMe53      # must match on both nodes
    }

    virtual_ipaddress {
        192.168.9.53/24           # the VIP clients use as their DNS server
    }

    track_script {
        chk_stellardns
    }
}

# ---------------------------------------------------------------------------
# What happens when things fail
#
#  Master node dies
#      BACKUP stops receiving advertisements, promotes itself after ~3 missed
#      adverts (~3s), sends a gratuitous ARP, and takes the VIP. Clients keep the
#      same DNS address throughout.
#
#  StellarDNS dies but the node stays up
#      chk_stellardns fails twice (~4s) -> this instance enters FAULT and releases
#      the VIP -> the other node takes it.
#
#  Upstream / WAN outage
#      Nothing happens, by design. Both nodes stay healthy and keep serving cache,
#      LANCache rewrites and internal zones. This is why the health check queries a
#      local name.
#
#  BOTH nodes down
#      The VIP is gone. Clients configured with only the VIP have no DNS.
#      -> Hand out a SECOND DNS server via DHCP (see below). This is the one
#         failure a VIP cannot cover.
#
#  VRRP traffic blocked between nodes (switch/firewall)
#      Both nodes believe they are MASTER and both claim the VIP: ARP conflicts and
#      intermittent resolution. The unicast_peer config above avoids the usual
#      multicast-filtering cause. If you use multicast instead, allow IP protocol
#      112 and 224.0.0.18 between the nodes.
#
#  Split-brain check
#      ip -br addr show | grep <VIP>    # run on BOTH nodes; exactly one should have it
# ---------------------------------------------------------------------------
#
# RECOMMENDED CLIENT CONFIG
#
#   DHCP DNS servers:  <VIP>, <node A physical IP>
#
# The VIP covers single-node failure with no client change. The second entry covers
# total VRRP failure or loss of both nodes. Do not list both physical IPs without
# the VIP — clients pick unpredictably and you lose deterministic failover.
